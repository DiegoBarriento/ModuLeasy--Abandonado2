services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "${API_PORT:-8080}:80"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: moduleasy
      DB_USER: moduleasy_app
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://moduleasy.vercel.app}
    volumes:
      - uploads_data:/var/www/html/uploads
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: moduleasy
      MYSQL_USER: moduleasy_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/moduleasy_script.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/stp_moduleasy.sql:/docker-entrypoint-initdb.d/02-procedures.sql:ro
      - ./db/mdt_moduleasy.sql:/docker-entrypoint-initdb.d/03-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  uploads_data: